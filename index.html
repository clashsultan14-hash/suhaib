      const [isAdmin, setIsAdmin] = useState(false);
      const [adminTab, setAdminTab] = useState("products");
      const [editingProduct, setEditingProduct] = useState(null);
      const [editForm, setEditForm] = useState(null);
      const [addForm, setAddForm] = useState({ ...emptyProduct });
      const [adminMsg, setAdminMsg] = useState("");
      const logoClickTimer = useRef(null);
      const cartRef = useRef(null);
      const passInputRef = useRef(null);

      const handleLogoClick = () => {
        const newCount = logoClickCount + 1;
        setLogoClickCount(newCount);
        if (logoClickTimer.current) clearTimeout(logoClickTimer.current);
        if (newCount >= 3) {
          setLogoClickCount(0);
          setPassInput(""); setPassError(false); setShowPassPrompt(true);
          setTimeout(() => passInputRef.current && passInputRef.current.focus(), 100);
        } else {
          logoClickTimer.current = setTimeout(() => setLogoClickCount(0), 800);
        }
      };

      const handlePassSubmit = () => {
        if (passInput === ADMIN_PASS) {
          setShowPassPrompt(false); setPassInput(""); setPassError(false);
          setIsAdmin(true); setAdminTab("products"); setCurrentPage("admin");
        } else {
          setPassError(true); setPassInput("");
          setTimeout(() => { setPassError(false); setShowPassPrompt(false); }, 1400);
        }
      };

      const exitAdmin = () => { setIsAdmin(false); setCurrentPage("home"); setEditingProduct(null); setEditForm(null); };

      const deleteProduct = (id) => {
        if (window.confirm("هل أنتِ متأكدة من حذف هذا المنتج؟")) {
          setProducts(prev => prev.filter(p => p.id !== id));
          showMsg("✓ تم حذف المنتج بنجاح");
        }
      };

      const startEdit = (product) => {
        setEditingProduct(product.id);
        setEditForm({ ...product, benefits: [...(product.benefits || [""])], bundleItems: product.bundleItems ? [...product.bundleItems] : [] });
        setAdminTab("edit");
      };

      const saveEdit = () => {
        const price = parseFloat(editForm.price);
        if (!editForm.name || isNaN(price)) return;
        setProducts(prev => prev.map(p => p.id === editingProduct ? { ...editForm, price, id: p.id } : p));
        setEditingProduct(null); setEditForm(null); setAdminTab("products");
        showMsg("✓ تم تحديث المنتج بنجاح");
      };

      const saveAdd = () => {
        const price = parseFloat(addForm.price);
        if (!addForm.name || isNaN(price)) return;
        const newId = Math.max(...products.map(p => p.id), 0) + 1;
        setProducts(prev => [...prev, { ...addForm, price, id: newId, benefits: addForm.benefits.filter(b => b.trim()), bundleItems: (addForm.bundleItems || []).filter(b => b.trim()) }]);
        setAddForm({ ...emptyProduct }); setAdminTab("products");
        showMsg("✓ تم إضافة المنتج بنجاح");
      };

      const showMsg = (msg) => { setAdminMsg(msg); setTimeout(() => setAdminMsg(""), 2500); };

      const filtered = activeCategory === "all" ? products : products.filter(p => p.category === activeCategory);
      const totalItems = cart.reduce((s, i) => s + i.qty, 0);
      const totalPrice = cart.reduce((s, i) => s + i.price * i.qty, 0);

      const addToCart = (product, e) => {
        if (e) e.stopPropagation();
        setCart(prev => { const ex = prev.find(i => i.id === product.id); return ex ? prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i) : [...prev, { ...product, qty: 1 }]; });
        setAddedId(product.id);
        setTimeout(() => setAddedId(null), 1200);
      };

      const updateQty = (id, delta) => setCart(prev => prev.map(i => i.id === id ? { ...i, qty: i.qty + delta } : i).filter(i => i.qty > 0));
      const openProduct = (p) => { setSelectedProduct(p); setCurrentPage("product"); window.scrollTo(0, 0); };
      const goHome = () => { setCurrentPage("home"); setSelectedProduct(null); };

      const confirmOrder = () => {
        const lines = cart.map(i => `- ${i.qty}x ${i.name} (${i.price * i.qty} ₪)`).join("\n");
        const msg = `مرحباً Beauty Box 🌸، أريد طلب المنتجات التالية:\n${lines}\n------------------\nالإجمالي: ${totalPrice} شيكل 💰\n\nبيانات التوصيل:\nالاسم: ____________\nالعنوان: ____________\nرقم الهاتف: ____________`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
      };

      useEffect(() => {
        const handleClick = (e) => { if (cartRef.current && !cartRef.current.contains(e.target)) setShowCart(false); };
        if (showCart) document.addEventListener("mousedown", handleClick);
        return () => document.removeEventListener("mousedown", handleClick);
      }, [showCart]);

      const inputStyle = { width: "100%", padding: "10px 12px", borderRadius: 10, border: "1.5px solid #f0e0e1", fontSize: 13, fontFamily: "'Tajawal',sans-serif", outline: "none", background: "#fff", color: "#1A1A1A", marginBottom: 10 };

      return (
        <div dir="rtl" style={{ fontFamily: "'Tajawal', sans-serif", backgroundColor: "#FAFAFA", color: "#1A1A1A", minHeight: "100vh", overflowX: "hidden" }}>

          {/* HEADER */}
          <header style={{ background: "#fff", borderBottom: "1px solid #f0e0e1", position: "sticky", top: 0, zIndex: 30, boxShadow: "0 2px 20px rgba(232,197,200,0.15)" }}>
            <div style={{ maxWidth: 480, margin: "0 auto", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              {currentPage === "product" ? (
                <button onClick={goHome} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, color: "#E8C5C8", fontSize: 14, fontFamily: "'Tajawal',sans-serif" }}>
                  <span style={{ fontSize: 20 }}>→</span><span style={{ color: "#1A1A1A" }}>رجوع</span>
                </button>
              ) : currentPage === "admin" ? (
                <button onClick={exitAdmin} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center", gap: 6, color: "#888", fontSize: 13, fontFamily: "'Tajawal',sans-serif" }}>
                  <span>→</span> خروج
                </button>
              ) : <div style={{ fontSize: 22 }}>🌸</div>}

              <div onClick={handleLogoClick} style={{ textAlign: "center", cursor: "default", userSelect: "none", WebkitUserSelect: "none" }}>
                <div style={{ fontSize: 20, fontWeight: 900, letterSpacing: 1, color: "#1A1A1A" }}>Beauty Box</div>
                <div style={{ fontSize: 10, color: "#E8C5C8", fontWeight: 500, letterSpacing: 0.5 }}>بيوتي بوكس</div>
              </div>

              {currentPage === "admin" ? <div style={{ fontSize: 18 }}>⚙️</div> : (
                <button onClick={() => setShowCart(true)} style={{ position: "relative", background: "none", border: "none", cursor: "pointer", fontSize: 22 }}>
                  🛒
                  {totalItems > 0 && <span style={{ position: "absolute", top: -6, left: -6, background: "#E8C5C8", color: "#fff", borderRadius: "50%", width: 18, height: 18, fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{totalItems}</span>}
                </button>
              )}
            </div>
          </header>

          {/* PASSCODE POPUP */}
          {showPassPrompt && (
            <>
              <div className="overlay" onClick={() => { setShowPassPrompt(false); setPassInput(""); setPassError(false); }} />
              <div className={`pass-popup${passError ? " shake" : ""}`} style={{ position: "fixed", top: "50%", left: "50%", transform: "translate(-50%,-50%)", zIndex: 60, background: "#fff", borderRadius: 20, padding: "32px 28px", width: "min(340px, 90vw)", boxShadow: "0 20px 60px rgba(0,0,0,0.18)", textAlign: "center" }}>
                <div style={{ fontSize: 36, marginBottom: 12 }}>{passError ? "❌" : "🔐"}</div>
                <div style={{ fontSize: 17, fontWeight: 800, marginBottom: 6, color: "#1A1A1A" }}>{passError ? "كلمة المرور خاطئة" : "لوحة الإدارة"}</div>
                {!passError && (
                  <>
                    <div style={{ fontSize: 13, color: "#aaa", marginBottom: 20 }}>أدخلي كلمة المرور للمتابعة</div>
                    <input ref={passInputRef} type="password" value={passInput} onChange={e => setPassInput(e.target.value)} onKeyDown={e => e.key === "Enter" && handlePassSubmit()} placeholder="• • • •" style={{ ...inputStyle, textAlign: "center", fontSize: 20, letterSpacing: 8, marginBottom: 16 }} />
                    <button className="btn-primary" onClick={handlePassSubmit} style={{ width: "100%", padding: "13px", borderRadius: 12, fontSize: 14, fontWeight: 800 }}>دخول ←</button>
                  </>
                )}
              </div>
            </>
          )}

          {/* ADMIN DASHBOARD */}
          {currentPage === "admin" && (
            <div className="admin-panel" style={{ maxWidth: 480, margin: "0 auto", padding: "20px 16px 60px" }}>
              <div style={{ background: "linear-gradient(135deg, #1A1A1A, #2d2d2d)", borderRadius: 18, padding: "20px", marginBottom: 20, color: "#fff" }}>
                <div style={{ fontSize: 22, marginBottom: 4 }}>⚙️ لوحة الإدارة</div>
                <div style={{ fontSize: 13, color: "#E8C5C8", fontWeight: 500 }}>إدارة منتجات Beauty Box</div>
                <div style={{ display: "flex", gap: 16, marginTop: 14 }}>
                  {[["المنتجات", products.length], ["بشرة", products.filter(p => p.category === "skincare").length], ["شعر", products.filter(p => p.category === "haircare").length], ["عطور", products.filter(p => p.category === "perfumes").length], ["صناديق", products.filter(p => p.category === "boxes").length]].map(([label, count], i, arr) => (
                    <React.Fragment key={label}>
                      <div style={{ textAlign: "center" }}>
                        <div style={{ fontSize: 20, fontWeight: 900, color: "#E8C5C8" }}>{count}</div>
                        <div style={{ fontSize: 11, color: "#aaa" }}>{label}</div>
                      </div>
                      {i < arr.length - 1 && <div style={{ width: 1, background: "#333" }} />}
                    </React.Fragment>
                  ))}
                </div>
              </div>

              {adminMsg && <div className="admin-msg" style={{ background: "linear-gradient(135deg, #d4edda, #c3e6cb)", border: "1px solid #b8d4be", borderRadius: 12, padding: "12px 16px", marginBottom: 16, fontSize: 14, fontWeight: 700, color: "#2d6a4f", textAlign: "center" }}>{adminMsg}</div>}

              <div style={{ display: "flex", gap: 20, marginBottom: 20, borderBottom: "1px solid #f0e0e1" }}>
                <button className={`admin-tab${adminTab === "products" ? " active" : ""}`} onClick={() => { setAdminTab("products"); setEditingProduct(null); setEditForm(null); }}>📦 المنتجات</button>
                <button className={`admin-tab${adminTab === "add" ? " active" : ""}`} onClick={() => setAdminTab("add")}>➕ إضافة منتج</button>
                {editingProduct && <button className={`admin-tab${adminTab === "edit" ? " active" : ""}`} onClick={() => setAdminTab("edit")}>✏️ تعديل</button>}
              </div>

              {adminTab === "products" && (
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {products.map(p => (
                    <div key={p.id} className="product-admin-card">
                      <div style={{ display: "flex", gap: 12, padding: 14, alignItems: "center" }}>
                        <img src={p.image} alt={p.name} style={{ width: 64, height: 64, borderRadius: 10, objectFit: "cover", flexShrink: 0 }} />
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 13, fontWeight: 800, marginBottom: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                          <div style={{ fontSize: 11, color: "#E8C5C8", fontWeight: 600, marginBottom: 4 }}>{p.brand}</div>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <span style={{ fontSize: 16, fontWeight: 900 }}>{p.price} ₪</span>
                            <span style={{ fontSize: 10, background: "#f5e8e8", color: "#c08589", borderRadius: 8, padding: "2px 7px", fontWeight: 600 }}>{categoryLabels[p.category]}</span>
                          </div>
                        </div>
                        <div style={{ display: "flex", flexDirection: "column", gap: 6, flexShrink: 0 }}>
                          <button className="btn-outline" onClick={() => startEdit(p)} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700 }}>✏️ تعديل</button>
                          <button className="btn-danger" onClick={() => deleteProduct(p.id)} style={{ padding: "6px 12px", borderRadius: 8, fontSize: 12, fontWeight: 700 }}>🗑 حذف</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {adminTab === "add" && <ProductForm form={addForm} setForm={setAddForm} onSave={saveAdd} onCancel={() => setAdminTab("products")} title="إضافة منتج جديد" saveLabel="➕ إضافة المنتج" />}
              {adminTab === "edit" && editForm && <ProductForm form={editForm} setForm={setEditForm} onSave={saveEdit} onCancel={() => { setAdminTab("products"); setEditingProduct(null); setEditForm(null); }} title="تعديل المنتج" saveLabel="💾 حفظ التعديلات" />}
            </div>
          )}

          {/* HOME PAGE */}
          {currentPage === "home" && (
            <div className="page-enter">
              <div className="hero-pattern" style={{ position: "relative", background: "linear-gradient(135deg, #fff 0%, #fdf5f5 100%)", padding: "40px 20px 30px", textAlign: "center", overflow: "hidden", borderBottom: "1px solid #f5e8e8" }}>
                <div className="flower" style={{ right: -20, top: -20 }}>🌺</div>
                <div className="flower" style={{ left: -20, bottom: -20, fontSize: 80 }}>✿</div>
                <div style={{ position: "relative", zIndex: 2 }}>
                  <div style={{ display: "inline-flex", alignItems: "center", gap: 8, background: "rgba(232,197,200,0.15)", border: "1px solid rgba(232,197,200,0.4)", borderRadius: 20, padding: "4px 14px", marginBottom: 16, fontSize: 12, color: "#c08589" }}>✨ عناية فاخرة بأسعار مناسبة</div>
                  <h1 style={{ fontSize: 32, fontWeight: 900, color: "#1A1A1A", lineHeight: 1.3, marginBottom: 10 }}>Beauty Box<br /><span style={{ fontSize: 18, fontWeight: 400, color: "#888" }}>بيوتي بوكس</span></h1>
                  <p style={{ fontSize: 15, color: "#666", fontWeight: 400 }}>صندوقكِ الخاص للجمال والعناية</p>
                  <div style={{ marginTop: 20, display: "flex", gap: 16, justifyContent: "center" }}>
                    {["🌿 طبيعي 100%", "💎 منتجات أصلية", "🚚 توصيل سريع"].map(t => <span key={t} style={{ fontSize: 11, color: "#c08589", fontWeight: 500 }}>{t}</span>)}
                  </div>
                </div>
              </div>

              <div style={{ padding: "20px 16px 8px", maxWidth: 480, margin: "0 auto" }}>
                <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
                  {categories.map(c => (
                    <button key={c.id} onClick={() => setActiveCategory(c.id)} className={`cat-btn${activeCategory === c.id ? " active" : ""}`} style={{ padding: "8px 16px", borderRadius: 20, fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", color: activeCategory === c.id ? "#fff" : "#1A1A1A", background: activeCategory === c.id ? "#E8C5C8" : "#fff" }}>
                      {c.label}
                    </button>
                  ))}
                </div>
              </div>

              <div style={{ maxWidth: 480, margin: "0 auto", padding: "12px 16px 120px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                {filtered.map(p => (
                  <div key={p.id} className="product-card" onClick={() => openProduct(p)} style={{ background: "#fff", borderRadius: 18, overflow: "hidden", boxShadow: "0 4px 20px rgba(0,0,0,0.06)", border: "1px solid #f5e8e8" }}>
                    <div style={{ position: "relative", aspectRatio: "1/1", overflow: "hidden" }}>
                      <img src={p.image} alt={p.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      {p.category === "boxes" && <span className="badge" style={{ position: "absolute", top: 8, right: 8, color: "#fff", fontSize: 9, fontWeight: 700, padding: "3px 8px", borderRadius: 10 }}>صندوق</span>}
                    </div>
                    <div style={{ padding: "12px 10px" }}>
                      <div style={{ fontSize: 10, color: "#E8C5C8", fontWeight: 600, marginBottom: 3 }}>{p.brand}</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#1A1A1A", marginBottom: 8, lineHeight: 1.4 }}>{p.name}</div>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                        <div style={{ fontSize: 15, fontWeight: 900 }}>{p.price} <span style={{ fontSize: 11, fontWeight: 400 }}>₪</span></div>
                        <button className={`btn-primary${addedId === p.id ? " btn-added" : ""}`} onClick={(e) => addToCart(p, e)} style={{ borderRadius: 10, padding: "6px 10px", fontSize: 11, fontWeight: 700 }}>
                          {addedId === p.id ? "✓ أُضيف" : "+ أضيفي"}
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* PRODUCT DETAIL */}
          {currentPage === "product" && selectedProduct && (
            <div className="page-enter" style={{ maxWidth: 480, margin: "0 auto", paddingBottom: 120 }}>
              <div style={{ position: "relative", height: 340, overflow: "hidden", background: "#f9f0f0" }}>
                <img src={selectedProduct.image} alt={selectedProduct.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(255,255,255,0.9) 0%, transparent 50%)" }} />
                {selectedProduct.category === "boxes" && <div style={{ position: "absolute", top: 16, left: 16 }}><span className="badge" style={{ color: "#fff", fontSize: 11, fontWeight: 700, padding: "5px 12px", borderRadius: 12 }}>صندوق فاخر ✨</span></div>}
              </div>
              <div style={{ padding: "0 20px" }}>
                <div style={{ marginTop: 20, marginBottom: 6, fontSize: 13, color: "#E8C5C8", fontWeight: 600 }}>{selectedProduct.brand}</div>
                <h2 style={{ fontSize: 24, fontWeight: 900, lineHeight: 1.3, marginBottom: 12 }}>{selectedProduct.name}</h2>
                <div style={{ fontSize: 30, fontWeight: 900, marginBottom: 16 }}>{selectedProduct.price} <span style={{ fontSize: 16, fontWeight: 400, color: "#888" }}>شيكل</span></div>
                <p style={{ fontSize: 14, color: "#555", lineHeight: 1.9, marginBottom: 24 }}>{selectedProduct.description}</p>
                {selectedProduct.bundleItems && selectedProduct.bundleItems.length > 0 && (
                  <div style={{ background: "linear-gradient(135deg, #fdf5f5, #fef9f9)", border: "1px solid #f0e0e1", borderRadius: 16, padding: 16, marginBottom: 24 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>📦 محتويات الصندوق</div>
                    {selectedProduct.bundleItems.map((item, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: i < selectedProduct.bundleItems.length - 1 ? "1px dashed #f0e0e1" : "none" }}>
                        <span style={{ color: "#E8C5C8", fontSize: 12 }}>✦</span><span style={{ fontSize: 13, color: "#444" }}>{item}</span>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{ marginBottom: 24 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
                    <div style={{ width: 4, height: 20, background: "linear-gradient(to bottom, #E8C5C8, #d4a0a4)", borderRadius: 2 }} />
                    <h3 style={{ fontSize: 16, fontWeight: 800 }}>لماذا تحتاجين هذا المنتج؟</h3>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {(selectedProduct.benefits || []).map((b, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 14px", background: "#fff", border: "1px solid #f5e8e8", borderRadius: 12 }}>
                        <span style={{ color: "#E8C5C8", fontSize: 14, marginTop: 1, flexShrink: 0 }}>✓</span>
                        <span style={{ fontSize: 13, color: "#444", lineHeight: 1.6 }}>{b}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{ background: "linear-gradient(135deg, #fdf5f5, #fef9f9)", border: "1px solid #f0e0e1", borderRadius: 16, padding: 18, marginBottom: 24 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                    <span style={{ fontSize: 18 }}>💆‍♀️</span>
                    <h3 style={{ fontSize: 15, fontWeight: 800 }}>طريقة الاستخدام</h3>
                  </div>
                  <p style={{ fontSize: 13, color: "#555", lineHeight: 2 }}>{selectedProduct.howToUse}</p>
                </div>
              </div>
              <div style={{ position: "fixed", bottom: 0, right: 0, left: 0, padding: "16px 20px", background: "#fff", borderTop: "1px solid #f0e0e1", boxShadow: "0 -8px 30px rgba(0,0,0,0.08)", zIndex: 25, maxWidth: 480, margin: "0 auto" }}>
                <button className={`btn-primary${addedId === selectedProduct.id ? " btn-added" : ""}`} onClick={(e) => addToCart(selectedProduct, e)} style={{ width: "100%", padding: "16px", borderRadius: 16, fontSize: 16, fontWeight: 800 }}>
                  {addedId === selectedProduct.id ? "✓ تمت الإضافة إلى السلة!" : `🛒 أضيفي إلى السلة — ${selectedProduct.price} ₪`}
                </button>
              </div>
            </div>
          )}

          {/* STICKY CART BAR */}
          {totalItems > 0 && currentPage === "home" && (
            <div className="sticky-bar" style={{ position: "fixed", bottom: 16, right: 16, left: 16, maxWidth: 448, margin: "0 auto", zIndex: 25 }}>
              <div onClick={() => setShowCart(true)} style={{ background: "linear-gradient(135deg, #1A1A1A, #2d2d2d)", borderRadius: 20, padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", boxShadow: "0 8px 30px rgba(0,0,0,0.25)" }}>
                <span style={{ background: "#E8C5C8", color: "#fff", borderRadius: "50%", width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800 }}>{totalItems}</span>
                <span style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>عرض السلة 🛒</span>
                <span style={{ color: "#E8C5C8", fontSize: 16, fontWeight: 900 }}>{totalPrice} ₪</span>
              </div>
            </div>
          )}

          {/* CART OVERLAY */}
          {showCart && (
            <>
              <div className="overlay" onClick={() => setShowCart(false)} />
              <div ref={cartRef} className="cart-panel" style={{ position: "fixed", bottom: 0, right: 0, left: 0, maxWidth: 480, margin: "0 auto", background: "#fff", borderRadius: "24px 24px 0 0", zIndex: 50, maxHeight: "85vh", display: "flex", flexDirection: "column", boxShadow: "0 -10px 40px rgba(0,0,0,0.15)" }}>
                <div style={{ padding: "20px 20px 0", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                  <h3 style={{ fontSize: 18, fontWeight: 800 }}>سلة المشتريات 🛒</h3>
                  <button onClick={() => setShowCart(false)} style={{ background: "#f5f5f5", border: "none", borderRadius: "50%", width: 32, height: 32, cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
                </div>
                <div style={{ width: 40, height: 4, background: "#E8C5C8", borderRadius: 2, margin: "12px auto 0", opacity: 0.5 }} />
                <div style={{ overflowY: "auto", flex: 1, padding: "16px 20px" }}>
                  {cart.length === 0 ? (
                    <div style={{ textAlign: "center", padding: 40, color: "#aaa" }}>
                      <div style={{ fontSize: 48, marginBottom: 12 }}>🛍️</div>
                      <div style={{ fontSize: 14 }}>سلتك فارغة، أضيفي منتجاتك المفضلة!</div>
                    </div>
                  ) : cart.map(item => (
                    <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 0", borderBottom: "1px solid #f5e8e8" }}>
                      <img src={item.image} alt={item.name} style={{ width: 60, height: 60, borderRadius: 12, objectFit: "cover", flexShrink: 0 }} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.name}</div>
                        <div style={{ fontSize: 13, fontWeight: 900 }}>{item.price * item.qty} ₪</div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                        <button onClick={() => updateQty(item.id, -1)} style={{ width: 28, height: 28, borderRadius: "50%", border: "1.5px solid #E8C5C8", background: "#fff", cursor: "pointer", fontSize: 16, color: "#E8C5C8", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                        <span style={{ fontSize: 14, fontWeight: 700, minWidth: 16, textAlign: "center" }}>{item.qty}</span>
                        <button onClick={() => updateQty(item.id, 1)} style={{ width: 28, height: 28, borderRadius: "50%", background: "#E8C5C8", border: "none", cursor: "pointer", fontSize: 16, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
                      </div>
                    </div>
                  ))}
                </div>
                {cart.length > 0 && (
                  <div style={{ padding: "16px 20px 24px", borderTop: "1px solid #f5e8e8" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
                      <span style={{ fontSize: 15, fontWeight: 600, color: "#666" }}>المجموع الكلي</span>
                      <span style={{ fontSize: 22, fontWeight: 900 }}>{totalPrice} <span style={{ fontSize: 14, fontWeight: 400 }}>₪</span></span>
                    </div>
                    <button className="btn-primary" onClick={confirmOrder} style={{ width: "100%", padding: 16, borderRadius: 16, fontSize: 15, fontWeight: 800, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                      <span>التأكيد على الطلب عبر WhatsApp</span><span style={{ fontSize: 18 }}>💬</span>
                    </button>
                    <div style={{ textAlign: "center", marginTop: 10, fontSize: 11, color: "#aaa" }}>سيتم فتح محادثة واتساب لتأكيد الطلب</div>
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
